<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#8fc8ea">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>CowWorld · a multiplayer farm for cows</title>
  <meta name="description" content="Be a cow. Graze, moo, chat and finish farm quests with your herd. Free multiplayer game, right in your browser, on desktop and mobile.">
  <meta name="apple-mobile-web-app-title" content="CowWorld">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <!-- Share previews. The Worker turns these paths into absolute URLs for the host being visited. -->
  <link rel="canonical" href="/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="CowWorld">
  <meta property="og:title" content="CowWorld · a multiplayer farm for cows">
  <meta property="og:description" content="Be a cow. Graze, moo, chat and finish farm quests with your herd. Free, right in your browser.">
  <meta property="og:url" content="/">
  <meta property="og:image" content="/og.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="A spotted cow with a golden bell standing in a green meadow next to a red barn, with the title CowWorld.">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="CowWorld · a multiplayer farm for cows">
  <meta name="twitter:description" content="Be a cow. Graze, moo, chat and finish farm quests with your herd. Free, right in your browser.">
  <meta name="twitter:image" content="/og.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="game"></canvas>
  <div id="labels"></div>

  <div id="hud" hidden>
    <div id="quests" class="panel"></div>

    <div id="side">
      <div id="players" class="panel"></div>
      <canvas id="minimap" width="180" height="180"></canvas>
    </div>

    <div id="timer" hidden></div>
    <div id="toast"></div>

    <div id="hint" hidden><kbd class="kb-only">E</kbd> <span id="hint-text"></span></div>

    <div id="chat">
      <div id="chatlog"></div>
      <form id="chatform">
        <input id="chatinput" maxlength="120" autocomplete="off" enterkeyhint="send" placeholder="Press Enter to chat">
      </form>
    </div>

    <div id="help">WASD move · Shift run · E interact · Space moo · Enter chat · Scroll zoom</div>

    <div id="dialog" class="panel" hidden>
      <div id="dialog-name"></div>
      <div id="dialog-text"></div>
      <div class="dialog-more"><span class="kb-only">E</span><span class="touch-only">Tap</span> ▸</div>
    </div>

    <div id="touch">
      <div id="stick"><div id="ring"><div id="knob"></div></div></div>
      <button id="btn-act" type="button">USE</button>
      <button id="btn-moo" type="button">MOO</button>
      <button id="btn-chat" type="button" aria-label="Chat">💬</button>
    </div>
  </div>

  <form id="join" class="panel">
    <h1>CowWorld</h1>
    <p class="tagline">Graze, chat and help out around the farm with your herd.</p>
    <input id="name" maxlength="16" placeholder="Your cow's name" autocomplete="off">
    <div class="field-label">Spots</div>
    <div id="colors"></div>
    <button id="play" type="submit">Moo! Let's go</button>
    <p class="controls kb-only">WASD move · Shift run · E interact · Space moo · Enter chat</p>
    <p class="controls touch-only">Drag left side to move · USE to interact · Pinch to zoom</p>
  </form>

  <script type="module" src="js/main.js"></script>
</body>
</html>
